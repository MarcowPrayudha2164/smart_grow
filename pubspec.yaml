name: smart_grow
description: "Smart Grow - Smart Hydroponic Monitoring App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cupertino_text_button: ^0.0.5
  awesome_dialog: ^3.3.0
  http: ^1.6.0
  dart_amqp: ^0.3.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/image/background.png

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/font/Lexend-Regular.ttf
        - asset: assets/font/Lexend-Bold.ttf
          weight: 700
        - asset: assets/font/Lexend-Light.ttf
          weight: 300

flutter_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/image/logo-app.png"